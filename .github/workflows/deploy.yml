name: Deploy API to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Update and start API
        shell: bash
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CATALOG_MEDIA_BUCKET: ${{ vars.CATALOG_MEDIA_BUCKET }}
          CATALOG_MEDIA_REGION: ${{ vars.CATALOG_MEDIA_REGION }}
          CATALOG_MEDIA_PUBLIC_BASE_URL: ${{ vars.CATALOG_MEDIA_PUBLIC_BASE_URL }}
        run: |
          database_connection_string_base64="$(printf '%s' "$DATABASE_CONNECTION_STRING" | base64 --wrap=0)"
          jwt_key_base64="$(printf '%s' "$JWT_KEY" | base64 --wrap=0)"
          aws_access_key_id_base64="$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 --wrap=0)"
          aws_secret_access_key_base64="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 --wrap=0)"
          catalog_media_bucket_base64="$(printf '%s' "$CATALOG_MEDIA_BUCKET" | base64 --wrap=0)"
          catalog_media_region_base64="$(printf '%s' "$CATALOG_MEDIA_REGION" | base64 --wrap=0)"
          catalog_media_public_base_url_base64="$(printf '%s' "$CATALOG_MEDIA_PUBLIC_BASE_URL" | base64 --wrap=0)"
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "DATABASE_CONNECTION_STRING_BASE64=$database_connection_string_base64 JWT_KEY_BASE64=$jwt_key_base64 AWS_ACCESS_KEY_ID_BASE64=$aws_access_key_id_base64 AWS_SECRET_ACCESS_KEY_BASE64=$aws_secret_access_key_base64 CATALOG_MEDIA_BUCKET_BASE64=$catalog_media_bucket_base64 CATALOG_MEDIA_REGION_BASE64=$catalog_media_region_base64 CATALOG_MEDIA_PUBLIC_BASE_URL_BASE64=$catalog_media_public_base_url_base64 bash -s" << 'EOF'
            set -euo pipefail
            export DATABASE_CONNECTION_STRING="$(printf '%s' "$DATABASE_CONNECTION_STRING_BASE64" | base64 --decode)"
            export JWT_KEY="$(printf '%s' "$JWT_KEY_BASE64" | base64 --decode)"
            export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID_BASE64" | base64 --decode)"
            export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY_BASE64" | base64 --decode)"
            export CATALOG_MEDIA_BUCKET="$(printf '%s' "$CATALOG_MEDIA_BUCKET_BASE64" | base64 --decode)"
            export CATALOG_MEDIA_REGION="$(printf '%s' "$CATALOG_MEDIA_REGION_BASE64" | base64 --decode)"
            export CATALOG_MEDIA_PUBLIC_BASE_URL="$(printf '%s' "$CATALOG_MEDIA_PUBLIC_BASE_URL_BASE64" | base64 --decode)"
            cd ~/crica-studio-api
            git pull --ff-only origin main
            docker compose up --build --detach
            docker compose ps
            curl --fail --silent --show-error http://localhost/health
          EOF
