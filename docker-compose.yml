services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: crica-studio-api:latest
    container_name: crica-studio-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: crica-studio-api-nginx:latest
    container_name: crica-studio-api-nginx
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt