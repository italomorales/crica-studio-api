services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: crica-studio-api:latest
    container_name: crica-studio-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-}
      Jwt__Key: ${JWT_KEY:-}
      Jwt__Issuer: ${JWT_ISSUER:-crica-studio-api}
      Jwt__Audience: ${JWT_AUDIENCE:-crica-studio-admin}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-480}
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: crica-studio-api-nginx:latest
    container_name: crica-studio-api-nginx
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
