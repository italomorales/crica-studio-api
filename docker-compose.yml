services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: crica-studio-api:latest
    container_name: crica-studio-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:-}
      Jwt__Key: ${JWT_KEY:-}
      Jwt__Issuer: ${JWT_ISSUER:-crica-studio-api}
      Jwt__Audience: ${JWT_AUDIENCE:-crica-studio-admin}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-480}
      CatalogMedia__Bucket: ${CATALOG_MEDIA_BUCKET:-}
      CatalogMedia__Region: ${CATALOG_MEDIA_REGION:-sa-east-1}
      CatalogMedia__PublicBaseUrl: ${CATALOG_MEDIA_PUBLIC_BASE_URL:-}
      Blog__FrontendDirectory: /app/blog-frontend
      Blog__PublicSiteUrl: ${BLOG_PUBLIC_SITE_URL:-https://www.cricastudio.com.br}
      Blog__FrontendShellUrl: ${BLOG_FRONTEND_SHELL_URL:-https://www.cricastudio.com.br/blog-shell.json}
      BlogSocial__ProxyKey: ${BLOG_SOCIAL_PROXY_KEY:-}
      BlogSocial__google__ClientId: ${BLOG_GOOGLE_CLIENT_ID:-}
      BlogSocial__google__ClientSecret: ${BLOG_GOOGLE_CLIENT_SECRET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
    volumes:
      - ./blog-frontend:/app/blog-frontend:ro
      - blog-data-protection:/home/app/.aspnet/DataProtection-Keys

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: crica-studio-api-nginx:latest
    container_name: crica-studio-api-nginx
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  blog-data-protection:
